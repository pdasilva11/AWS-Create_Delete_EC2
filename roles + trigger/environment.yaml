AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Ephemeral EC2 environment. One stack per environment. Creating the stack
  onboards a Password Safe managed account; deleting the stack deregisters it.
  There is no separate cleanup job by design.
 
Parameters:
  EnvName:
    Type: String
    Description: Short environment name, e.g. "build-1042". Becomes the asset name.
    AllowedPattern: '[a-z0-9][a-z0-9-]{1,30}'
 
  TeamConfig:
    Type: String
    Description: >
      The contents of config/<team>.json passed through as a JSON string.
      The pipeline supplies this; do not hand-edit.
 
  RegistrarFunctionArn:
    Type: String
    Description: Output of the registrar stack.
 
  AmiId:
    Type: AWS::EC2::Image::Id
    Default: ami-075d73f700ef0e7b3
 
  InstanceType:
    Type: String
    Default: t3.micro
 
  VpcId:
    Type: AWS::EC2::VPC::Id
 
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Private subnet. These hosts should not be publicly addressable.
 
  ResourceBrokerCidr:
    Type: String
    Description: >
      CIDR of the Password Safe Resource Broker / Secure Remote Access node
      that will reach this host on SSH to rotate the credential. Password Safe
      Cloud cannot reach a private IP directly - see docs/ARCHITECTURE.md.
    Default: 10.0.0.0/16
    AllowedPattern: '(\d{1,3}\.){3}\d{1,3}/\d{1,2}'
 
  OwnerTag:
    Type: String
    Description: DevOpsL1 or DevOpsL2. Drives Smart Rule membership.
 
  FunctionalAccountName:
    Type: String
    Default: ps-rotator
    Description: >
      Local account Password Safe logs in AS to rotate the managed account.
      Must match the Functional Account configured in BeyondInsight.
 
  FunctionalAccountPubKeyParam:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /ps-ephemeral/functional-account/public-key
    Description: >
      SSM Parameter holding the PUBLIC half of the functional account's SSH
      key. Public keys are not secrets, so a plain String parameter is correct
      here - do not put the private key in AWS; it belongs only in Password Safe.
 
  ManagedByTag:
    Type: String
    Default: ps-ephemeral-ec2
 
Resources:
 
  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub 'ephemeral ${EnvName} - SSH from Password Safe broker only'
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref ResourceBrokerCidr
          Description: Password Safe credential rotation and session proxying
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: SSM agent and package repos
      Tags:
        - {Key: Name, Value: !Sub 'sg-${EnvName}'}
        - {Key: Owner, Value: !Ref OwnerTag}
        - {Key: ManagedBy, Value: !Ref ManagedByTag}
 
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      # SSM agent connectivity only. The instance itself has NO permission to
      # read the Password Safe secret or call the Password Safe API - it is
      # the subject of the credential, not a consumer of it.
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore'
 
  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]
 
  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      SubnetId: !Ref SubnetId
      IamInstanceProfile: !Ref InstanceProfile
      SecurityGroupIds: [!Ref InstanceSecurityGroup]
      # No KeyName. Access is via Password Safe or SSM Session Manager; a
      # key pair would be a standing credential outside the vault.
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 8
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      MetadataOptions:
        HttpTokens: required          # IMDSv2 only
        HttpPutResponseHopLimit: 1
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          dnf install -y amazon-ssm-agent || yum install -y amazon-ssm-agent
          systemctl enable --now amazon-ssm-agent
          hostnamectl set-hostname ${EnvName}
 
          # Functional account: the identity Password Safe logs in AS in order
          # to rotate the managed account. It must exist before onboarding,
          # because AutoManagementFlag=true requires a FunctionalAccountID and
          # the very first rotation happens seconds later.
          #
          # Only the PUBLIC key is placed here. The private half lives solely
          # in Password Safe, so a compromised instance yields nothing that
          # can be replayed against any other host.
          id -u ${FunctionalAccountName} >/dev/null 2>&1 || \
            useradd -m -s /bin/bash ${FunctionalAccountName}
          install -d -m 700 -o ${FunctionalAccountName} -g ${FunctionalAccountName} \
            /home/${FunctionalAccountName}/.ssh
          cat > /home/${FunctionalAccountName}/.ssh/authorized_keys <<'PUBKEY'
          ${FunctionalAccountPubKeyParam}
          PUBKEY
          chown ${FunctionalAccountName}:${FunctionalAccountName} \
            /home/${FunctionalAccountName}/.ssh/authorized_keys
          chmod 600 /home/${FunctionalAccountName}/.ssh/authorized_keys
 
          # Passwordless sudo, restricted to the two commands rotation needs.
          cat > /etc/sudoers.d/90-${FunctionalAccountName} <<'SUDO'
          ${FunctionalAccountName} ALL=(root) NOPASSWD: /usr/sbin/chpasswd, /usr/bin/passwd
          SUDO
          chmod 440 /etc/sudoers.d/90-${FunctionalAccountName}
 
          # NOTE: the MANAGED account is deliberately NOT created here, and no
          # password appears anywhere in this script. The registrar creates it
          # over SSM, because user-data is readable from IMDS and stored in
          # plaintext in the instance description.
      Tags:
        - {Key: Name, Value: !Ref EnvName}
        - {Key: Owner, Value: !Ref OwnerTag}
        - {Key: Lifecycle, Value: ephemeral}
        - {Key: ManagedBy, Value: !Ref ManagedByTag}
 
  # The lifecycle hook. Create onboards, Delete deregisters.
  # Ordering is already guaranteed by the Ref/GetAtt below - an explicit
  # DependsOn would be redundant. Note that this only guarantees RunInstances
  # returned; actual boot readiness is gated inside the Lambda via SSM.
  PasswordSafeRegistration:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceToken: !Ref RegistrarFunctionArn
      # Changing any of these triggers an Update, not a replacement.
      InstanceId: !Ref Instance
      PrivateIp: !GetAtt Instance.PrivateIp
      PrivateDnsName: !GetAtt Instance.PrivateDnsName
      AssetName: !Ref EnvName
      Config: !Ref TeamConfig
 
Outputs:
  InstanceId:
    Value: !Ref Instance
  PrivateIp:
    Value: !GetAtt Instance.PrivateIp
  ManagedAccountId:
    Description: Use with the Password Safe API to request the credential.
    Value: !GetAtt PasswordSafeRegistration.ManagedAccountId
  ManagedSystemId:
    Value: !GetAtt PasswordSafeRegistration.ManagedSystemId
  AccountName:
    Value: !GetAtt PasswordSafeRegistration.AccountName
  Workgroup:
    Value: !GetAtt PasswordSafeRegistration.Workgroup
 
