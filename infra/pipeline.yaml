AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Per-team delivery pipeline. Deploy this stack TWICE - once with TeamName=l1,
  once with TeamName=l2. Each gets its own role, its own artifact bucket and a
  CFN execution role that can only touch stacks tagged for that team. This is
  the IAM half of the isolation model; the Password Safe half is the Workgroup.

Parameters:
  TeamName:
    Type: String
    AllowedValues: [l1, l2]

  OwnerTag:
    Type: String
    Description: DevOpsL1 or DevOpsL2. Must match config/<team>.json.

  ConnectionArn:
    Type: String
    Description: CodeStar Connections ARN for the GitHub repo.

  RepositoryId:
    Type: String
    Description: e.g. myorg/ps-ephemeral-ec2

  BranchName:
    Type: String
    Default: main

  RegistrarStackName:
    Type: String
    Default: ps-registrar
    Description: Name of the deployed registrar stack, for cross-stack import.

  VpcId:
    Type: AWS::EC2::VPC::Id

  SubnetId:
    Type: AWS::EC2::Subnet::Id

  ResourceBrokerCidr:
    Type: String
    Default: 10.0.0.0/16

  FunctionalAccountPubKeyParam:
    Type: String
    Default: /ps-ephemeral/functional-account/public-key
    Description: >
      SSM Parameter name holding the PUBLIC key of the Password Safe functional
      account. Passed through to the environment stacks.

Resources:

  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'ps-eph-artifacts-${TeamName}-${AWS::AccountId}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-artifacts
            Status: Enabled
            ExpirationInDays: 30

  # ---------------------------------------------------------------- #
  # CloudFormation execution role - the sharp end of team isolation.
  # ---------------------------------------------------------------- #
  CfnExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'ps-eph-cfn-exec-${TeamName}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: cloudformation.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: deploy-ephemeral-env
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: Ec2Lifecycle
                Effect: Allow
                Action:
                  - ec2:RunInstances
                  - ec2:TerminateInstances
                  - ec2:Describe*
                  - ec2:CreateTags
                  - ec2:DeleteTags
                  - ec2:CreateSecurityGroup
                  - ec2:DeleteSecurityGroup
                  - ec2:AuthorizeSecurityGroup*
                  - ec2:RevokeSecurityGroup*
                  # environment.yaml's per-instance AWS::EC2::KeyPair (the
                  # managed account's SSH key -- see docs/RUNBOOK.md 1c) is
                  # created/deleted under THIS role, not the registrar's --
                  # CloudFormation invokes the resource handler as the
                  # stack's own execution role.
                  - ec2:CreateKeyPair
                  - ec2:DeleteKeyPair
                Resource: '*'

              # AWS::EC2::KeyPair's resource handler writes the generated
              # private key to SSM Parameter Store itself (as a SecureString
              # at /ec2/keypair/{KeyPairId}) and deletes it again when the
              # KeyPair is deleted -- both under this same execution role.
              - Sid: ManageGeneratedKeyPairParameter
                Effect: Allow
                Action:
                  - ssm:PutParameter
                  - ssm:GetParameter
                  - ssm:DeleteParameter
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/ec2/keypair/*'

              - Sid: EncryptGeneratedKeyPairViaSsmOnly
                Effect: Allow
                Action:
                  - kms:GenerateDataKey
                  - kms:Decrypt
                Resource: '*'
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub 'ssm.${AWS::Region}.amazonaws.com'

              # Encrypted: true with no CMK means the aws/ebs managed key,
              # whose key policy delegates to IAM -- so the CALLER needs these
              # or RunInstances fails outright. kms:ViaService keeps them
              # usable only through EC2, never for decrypting anything else.
              - Sid: EncryptedEbsViaEc2Only
                Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKeyWithoutPlaintext
                  - kms:CreateGrant
                  - kms:DescribeKey
                  - kms:ReEncryptFrom
                  - kms:ReEncryptTo
                Resource: '*'
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub 'ec2.${AWS::Region}.amazonaws.com'

              # Only roles in this team's path, so l1 cannot craft a role that
              # reads l2's material.
              #
              # The List*/Get* actions are not optional: CloudFormation
              # enumerates attachments before DeleteRole, so without them
              # creation succeeds and TEARDOWN fails -- the path that runs most
              # often on ephemeral infrastructure.
              #
              # iam:AttachRolePolicy is deliberately NOT here. See below.
              # Read-only and destructive-but-not-escalating IAM. Safe
              # without a boundary condition: none of these can widen a role.
              - Sid: ScopedIam
                Effect: Allow
                Action:
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:DetachRolePolicy
                  - iam:ListAttachedRolePolicies
                  - iam:CreateInstanceProfile
                  - iam:DeleteInstanceProfile
                  - iam:AddRoleToInstanceProfile
                  - iam:RemoveRoleFromInstanceProfile
                  - iam:GetInstanceProfile
                Resource:
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/ps-eph-${TeamName}-*'
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:instance-profile/ps-eph-${TeamName}-*'

              # ESCALATION GUARD.
              # CreateRole and PutRolePolicy CAN widen a role, so both are
              # gated on the target carrying the permissions boundary. The
              # pipeline may create roles all day; it cannot create one that
              # exceeds the ceiling, and it has no Put/DeleteRolePermissions-
              # Boundary rights with which to raise that ceiling.
              - Sid: CreateRolesOnlyWithinBoundary
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:PutRolePolicy
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/ps-eph-${TeamName}-*'
                Condition:
                  StringEquals:
                    iam:PermissionsBoundary:
                      Fn::ImportValue: !Sub '${RegistrarStackName}-RoleBoundaryArn'

              # PRIVILEGE ESCALATION GUARD.
              # Unconditioned, iam:AttachRolePolicy lets this role attach
              # AdministratorAccess to an instance role it just created, then
              # pass that role to EC2 -- giving any instance full account
              # access and stepping straight out of the team boundary.
              # environment.yaml only ever attaches AmazonSSMManagedInstanceCore,
              # so pin it to exactly that ARN.
              - Sid: OnlySsmCoreMayBeAttached
                Effect: Allow
                Action: iam:AttachRolePolicy
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/ps-eph-${TeamName}-*'
                Condition:
                  ArnEquals:
                    iam:PolicyARN: !Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore'

              - Sid: PassRoleToEc2Only
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/ps-eph-${TeamName}-*'
                Condition:
                  StringEquals:
                    iam:PassedToService: ec2.amazonaws.com

              - Sid: InvokeRegistrar
                Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  Fn::ImportValue: !Sub '${RegistrarStackName}-RegistrarFunctionArn'

              # CloudFormation resolves AWS::SSM::Parameter::Value<String>
              # using THIS role, so it needs read on the public-key parameter.
              - Sid: ReadFunctionalAccountPublicKey
                Effect: Allow
                Action: [ssm:GetParameter, ssm:GetParameters]
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${FunctionalAccountPubKeyParam}'

  # ---------------------------------------------------------------- #
  # Reconciler. CodePipeline's native CFN action deploys exactly one
  # stack per action, which cannot express "N environments declared in
  # Git". So the deploy stage is a CodeBuild job that diffs the
  # manifests against deployed stacks and converges.
  # ---------------------------------------------------------------- #
  ReconcileRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: codebuild.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: reconcile
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/*'
              - Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion, s3:PutObject]
                Resource: !Sub '${ArtifactBucket.Arn}/*'
              - Sid: OnlyThisTeamsStacks
                Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DeleteStack
                  - cloudformation:CreateChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:GetTemplateSummary
                Resource: !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/ps-eph-${TeamName}-*/*'
              - Effect: Allow
                Action: cloudformation:ListStacks
                Resource: '*'
              - Sid: PassOnlyOwnExecutionRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CfnExecutionRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: cloudformation.amazonaws.com

  ReconcileProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub 'ps-eph-reconcile-${TeamName}'
      ServiceRole: !GetAtt ReconcileRole.Arn
      Artifacts: {Type: CODEPIPELINE}
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
        EnvironmentVariables:
          - {Name: TEAM, Value: !Ref TeamName}
          - {Name: OWNER_TAG, Value: !Ref OwnerTag}
          - {Name: STACK_PREFIX, Value: !Sub 'ps-eph-${TeamName}-'}
          - {Name: CFN_EXEC_ROLE, Value: !GetAtt CfnExecutionRole.Arn}
          - {Name: VPC_ID, Value: !Ref VpcId}
          - {Name: SUBNET_ID, Value: !Ref SubnetId}
          - {Name: BROKER_CIDR, Value: !Ref ResourceBrokerCidr}
          - {Name: FUNCTIONAL_ACCOUNT_PUBKEY_PARAM, Value: !Ref FunctionalAccountPubKeyParam}
          - Name: REGISTRAR_ARN
            Value:
              Fn::ImportValue: !Sub '${RegistrarStackName}-RegistrarFunctionArn'
          - Name: ROLE_BOUNDARY_ARN
            Value:
              Fn::ImportValue: !Sub '${RegistrarStackName}-RoleBoundaryArn'
      Source:
        Type: CODEPIPELINE
        BuildSpec: buildspec.yml

  PipelineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: codepipeline.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: pipeline
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion, s3:PutObject, s3:GetBucketVersioning]
                Resource: [!GetAtt ArtifactBucket.Arn, !Sub '${ArtifactBucket.Arn}/*']
              - Effect: Allow
                Action: [codebuild:StartBuild, codebuild:BatchGetBuilds]
                Resource: !GetAtt ReconcileProject.Arn
              - Effect: Allow
                Action: codestar-connections:UseConnection
                Resource: !Ref ConnectionArn

  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub 'ps-eph-${TeamName}'
      PipelineType: V2
      RoleArn: !GetAtt PipelineRole.Arn
      ArtifactStore: {Type: S3, Location: !Ref ArtifactBucket}
      Stages:
        - Name: Source
          Actions:
            - Name: Git
              ActionTypeId:
                {Category: Source, Owner: AWS, Provider: CodeStarSourceConnection, Version: '1'}
              Configuration:
                ConnectionArn: !Ref ConnectionArn
                FullRepositoryId: !Ref RepositoryId
                BranchName: !Ref BranchName
                DetectChanges: true
              OutputArtifacts: [{Name: Src}]

        - Name: Reconcile
          Actions:
            - Name: ConvergeEnvironments
              ActionTypeId:
                {Category: Build, Owner: AWS, Provider: CodeBuild, Version: '1'}
              Configuration: {ProjectName: !Ref ReconcileProject}
              InputArtifacts: [{Name: Src}]

      # Only fire when THIS team's files change. Without this, an L2 commit
      # would run L1's pipeline.
      Triggers:
        - ProviderType: CodeStarSourceConnection
          GitConfiguration:
            SourceActionName: Git
            Push:
              - Branches: {Includes: [!Ref BranchName]}
                FilePaths:
                  Includes:
                    - !Sub 'teams/${TeamName}/**'
                    - !Sub 'config/${TeamName}.json'
                    - 'infra/**'

Outputs:
  PipelineName:
    Value: !Ref Pipeline
  CfnExecutionRoleArn:
    Value: !GetAtt CfnExecutionRole.Arn
