AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Bootstraps the shared Password Safe functional account entirely from
  CloudFormation -- no local box, no ssh-keygen, no human running a script.
  Deploy ONCE, after infra/registrar.yaml exists and its Onboarder secret
  holds real credentials (not the REPLACE_ME placeholder). Kept as a separate
  template on purpose: this Custom Resource needs that secret populated, and
  CloudFormation rolls back an entire stack on any Create failure -- folding
  this into registrar.yaml would take RegistrarFunction down with it on the
  very first deploy. See docs/RUNBOOK.md section 1b for the full explanation.

Parameters:
  PSBaseUrl:
    Type: String
    Default: https://pf65f41b.ps.beyondtrustcloud.com/BeyondTrust/api/public/v3

  RegistrarStackName:
    Type: String
    Default: ps-registrar
    Description: Name of the already-deployed registrar stack.

  CodeS3Bucket:
    Type: String
    Description: >
      Same bucket/key as the registrar's package.sh output -- this function's
      handler ships in the same zip (functional_bootstrap.py + ssh_pubkey.py
      alongside handler.py + passwordsafe.py).

  CodeS3Key:
    Type: String
    Default: registrar/registrar.zip

  FunctionalAccountName:
    Type: String
    Default: ps-rotator
    Description: Must match passwordSafe.functionalAccountName in config/*.json.

  PlatformName:
    Type: String
    Default: Linux

  ElevationCommand:
    Type: String
    Default: sudo
    AllowedValues: [sudo, pbrun, pmrun]

  FunctionalAccountPubKeyParam:
    Type: String
    Default: /ps-ephemeral/functional-account/public-key
    Description: >
      Must match the parameter name environment.yaml and pipeline.yaml pass
      around as FunctionalAccountPubKeyParam.

  LogRetentionDays:
    Type: Number
    Default: 90
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 180, 365]

Resources:

  # AWS generates the key pair. We never generate RSA key material ourselves.
  FunctionalAccountKeyPair:
    Type: AWS::EC2::KeyPair
    Properties:
      KeyName: !Sub '${AWS::StackName}-${FunctionalAccountName}'
      KeyType: rsa
      KeyFormat: pem
      Tags:
        - {Key: Purpose, Value: password-safe-functional-account}

  BootstrapLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-bootstrap'
      RetentionInDays: !Ref LogRetentionDays

  BootstrapRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: bootstrap
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              - Sid: Logs
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub '${BootstrapLogGroup.Arn}:*'

              - Sid: ReadOnboarderSecret
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  Fn::ImportValue: !Sub '${RegistrarStackName}-OnboarderSecretArn'

              # The ONE thing this function reads that it didn't create
              # itself: the private key AWS::EC2::KeyPair auto-stored.
              - Sid: ReadGeneratedPrivateKey
                Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/ec2/keypair/${FunctionalAccountKeyPair.KeyPairId}'

              # SecureString decrypt. Scoped to "only via SSM", not to a
              # specific key ARN, because AWS manages that key for us and we
              # don't want to guess its ARN.
              - Sid: DecryptGeneratedPrivateKey
                Effect: Allow
                Action: kms:Decrypt
                Resource: '*'
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub 'ssm.${AWS::Region}.amazonaws.com'

              - Sid: PublishPublicKey
                Effect: Allow
                Action: ssm:PutParameter
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${FunctionalAccountPubKeyParam}'

  BootstrapFunction:
    Type: AWS::Lambda::Function
    DependsOn: BootstrapLogGroup
    Properties:
      FunctionName: !Sub '${AWS::StackName}-bootstrap'
      Handler: functional_bootstrap.lambda_handler
      Runtime: python3.12
      Role: !GetAtt BootstrapRole.Arn
      Timeout: 60
      MemorySize: 256
      Code:
        S3Bucket: !Ref CodeS3Bucket
        S3Key: !Ref CodeS3Key
      Environment:
        Variables:
          PS_BASE_URL: !Ref PSBaseUrl
          PS_SECRET_ARN:
            Fn::ImportValue: !Sub '${RegistrarStackName}-OnboarderSecretArn'

  FunctionalAccountBootstrap:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceToken: !GetAtt BootstrapFunction.Arn
      KeyPairId: !GetAtt FunctionalAccountKeyPair.KeyPairId
      AccountName: !Ref FunctionalAccountName
      PlatformName: !Ref PlatformName
      ElevationCommand: !Ref ElevationCommand
      PublicKeyParamName: !Ref FunctionalAccountPubKeyParam

Outputs:
  FunctionalAccountId:
    Value: !GetAtt FunctionalAccountBootstrap.FunctionalAccountId
  PublicKeyParam:
    Value: !GetAtt FunctionalAccountBootstrap.PublicKeyParam
  KeyPairId:
    Description: >
      If you ever need the private key again (e.g. to inspect it), it lives
      at /ec2/keypair/<this id> in SSM Parameter Store, as a SecureString.
    Value: !GetAtt FunctionalAccountKeyPair.KeyPairId
